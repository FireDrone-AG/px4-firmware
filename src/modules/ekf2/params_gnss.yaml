module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_GPS_CTRL:
      description:
        short: GNSS sensor aiding
        long: 'Set bits in the following positions to enable: 0 : Longitude and latitude
          fusion 1 : Altitude fusion 2 : 3D velocity fusion 3 : Dual antenna heading
          fusion'
      type: bitmask
      bit:
        0: Lon/lat
        1: Altitude
        2: 3D velocity
        3: Dual antenna heading
      default: 7
      min: 0
      max: 15
    EKF2_GPS_MODE:
      description:
        short: Fusion reset mode
        long: 'Automatic: reset on fusion timeout if no other source of position is available.
          Dead-reckoning: reset on fusion timeout if no source of velocity is available.
          Strict: the GNSS quality checks selected by EKF2_GPS_CHECK use the EKF2_REQ_*
          thresholds and the EKF2_REQ_GPS_H health time in flight as well (the drift and
          stationary speed checks are skipped in flight). GNSS is only used after the rejoin:
          over a window of EKF2_REQ_GPS_H the heading, position and altitude derived from
          GNSS must be consistent with the other aiding sources (EKF2_GPS_RJ_*). The heading,
          position and altitude are then reset or fused once. While in use, a sample failing
          the checks, no data or no fusion for EKF2_GPS_RJ_TOUT stops all GNSS fusion until
          the next rejoin. Strict mode needs another source of horizontal aiding (e.g. vision)
          to rejoin, does not run the EKF-GSF yaw estimator and never resets to GNSS while in use.'
      type: enum
      values:
        0: Automatic
        1: Dead-reckoning
        2: Strict
      default: 0
    EKF2_GPS_RJ_K:
      description:
        short: GNSS rejoin consistency factor
        long: 'Strict mode only. Over the rejoin window, the RMS scatter of the GNSS velocity
          residual, of the carried-forward GNSS positions and of the carried-forward GNSS
          altitudes must each be at most this factor times the RMS accuracy used for fusion
          (reported accuracy, limited below by EKF2_GPS_V_NOISE, EKF2_GPS_P_NOISE and
          1.5 x EKF2_GPS_P_NOISE).'
      type: float
      default: 1.0
      min: 0.1
      max: 10.0
      decimal: 2
    EKF2_GPS_RJ_YSD:
      description:
        short: GNSS rejoin maximum heading uncertainty
        long: 'Strict mode only. Maximum 1-sigma uncertainty of the heading correction fitted
          from GNSS velocity over the rejoin window, or of the EKF heading if the fit is not
          available, for GNSS to rejoin.'
      type: float
      default: 2.0
      min: 0.1
      max: 30.0
      unit: deg
      decimal: 1
    EKF2_GPS_RJ_VMIN:
      description:
        short: GNSS rejoin minimum speed for the heading fit
        long: 'Strict mode only. Minimum RMS horizontal speed over the rejoin window to use the
          heading fitted from GNSS velocity. Guards against constant velocity errors that the
          scatter does not show. Set to 0 to rely on EKF2_GPS_RJ_YSD only.'
      type: float
      default: 0.3
      min: 0.0
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_GPS_RJ_YRST:
      description:
        short: GNSS rejoin heading reset threshold
        long: 'Strict mode only. If the fitted heading correction is larger than this, or the
          heading was never aligned, the heading is reset at the rejoin. Otherwise GNSS fusion
          corrects it.'
      type: float
      default: 3.0
      min: 0.0
      max: 180.0
      unit: deg
      decimal: 1
    EKF2_GPS_RJ_PRST:
      description:
        short: GNSS rejoin position reset threshold
        long: 'Strict mode only. If the GNSS horizontal position offset found at the rejoin is
          larger than this, the position is reset to GNSS. Otherwise GNSS fusion corrects it.'
      type: float
      default: 0.2
      min: 0.0
      max: 100.0
      unit: m
      decimal: 2
    EKF2_GPS_RJ_HRST:
      description:
        short: GNSS rejoin altitude reset threshold
        long: 'Strict mode only. If GNSS is the height reference and the altitude offset found
          at the rejoin is larger than this, the altitude is reset to GNSS. Otherwise GNSS fusion
          corrects it.'
      type: float
      default: 0.5
      min: 0.0
      max: 100.0
      unit: m
      decimal: 2
    EKF2_GPS_RJ_TOUT:
      description:
        short: GNSS strict mode fusion timeout
        long: 'Strict mode only. If GNSS velocity, position or height has not been fused for this
          time (innovations rejected or no data), all GNSS fusion is stopped and GNSS has to go
          through the rejoin again.'
      type: float
      default: 5.0
      min: 0.5
      max: 60.0
      unit: s
      decimal: 1
    EKF2_GPS_P_NOISE:
      description:
        short: Measurement noise for GNSS position
      type: float
      default: 0.5
      min: 0.01
      max: 10.0
      unit: m
      decimal: 2
    EKF2_GPS_P_GATE:
      description:
        short: Gate size for GNSS position fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_YAW_OFF:
      description:
        short: Heading/Yaw offset for dual antenna GPS
      type: float
      default: 0.0
      min: 0.0
      max: 360.0
      unit: deg
      decimal: 1
    EKF2_GPS_V_GATE:
      description:
        short: Gate size for GNSS velocity fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_GPS_V_NOISE:
      description:
        short: Measurement noise for GNSS velocity
      type: float
      default: 0.3
      min: 0.01
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_GPS_CHECK:
      description:
        short: Integer bitmask controlling GPS checks
        long: 'Each threshold value is defined by the parameter indicated next to the check.
          Drift and offset checks only run when the vehicle is on ground and stationary.'
      type: bitmask
      bit:
        0: Sat count (EKF2_REQ_NSATS)
        1: PDOP (EKF2_REQ_PDOP)
        2: EPH (EKF2_REQ_EPH)
        3: EPV (EKF2_REQ_EPV)
        4: Speed accuracy (EKF2_REQ_SACC)
        5: Horizontal position drift (EKF2_REQ_HDRIFT)
        6: Vertical position drift (EKF2_REQ_VDRIFT)
        7: Horizontal speed offset (EKF2_REQ_HDRIFT)
        8: Vertical speed offset (EKF2_REQ_VDRIFT)
        9: Spoofing
        10: GPS fix type (EKF2_REQ_FIX)
        11: Jamming
      default: 2047
      min: 0
      max: 4095
    EKF2_REQ_EPH:
      description:
        short: Required EPH to use GPS
      type: float
      default: 3.0
      min: 0.1
      max: 100
      unit: m
      decimal: 1
    EKF2_REQ_EPV:
      description:
        short: Required EPV to use GPS
      type: float
      default: 5.0
      min: 0.1
      max: 100
      unit: m
      decimal: 1
    EKF2_REQ_SACC:
      description:
        short: Required speed accuracy to use GPS
      type: float
      default: 0.5
      min: 0.5
      max: 5.0
      unit: m/s
      decimal: 2
    EKF2_REQ_NSATS:
      description:
        short: Required satellite count to use GPS
      type: int32
      default: 6
      min: 4
      max: 12
    EKF2_REQ_PDOP:
      description:
        short: Maximum PDOP to use GPS
      type: float
      default: 2.5
      min: 1.5
      max: 5.0
      decimal: 1
    EKF2_REQ_HDRIFT:
      description:
        short: Maximum horizontal drift speed to use GPS
      type: float
      default: 0.1
      min: 0.1
      max: 1.0
      unit: m/s
      decimal: 2
    EKF2_REQ_VDRIFT:
      description:
        short: Maximum vertical drift speed to use GPS
      type: float
      default: 0.2
      min: 0.1
      max: 1.5
      decimal: 2
      unit: m/s
    EKF2_REQ_FIX:
      description:
        short: Required GPS fix
        long: Minimum GPS fix type required for GPS usage.
      type: enum
      values:
        0: No fix required
        2: 2D fix
        3: 3D fix
        4: RTCM code differential
        5: RTK float
        6: RTK fixed
        8: Extrapolated
      default: 3
    EKF2_REQ_GPS_H:
      description:
        short: Required GPS health time on startup
        long: Minimum continuous period without GPS failure required to mark a healthy
          GPS status. It can be reduced to speed up initialization, but it's recommended
          to keep this unchanged for a vehicle.
      type: float
      default: 10.0
      min: 0.1
      decimal: 1
      unit: s
      reboot_required: true
    EKF2_GSF_TAS:
      description:
        short: Default value of true airspeed used in EKF-GSF AHRS calculation
        long: If no airspeed measurements are available, the EKF-GSF AHRS calculation
          will assume this value of true airspeed when compensating for centripetal
          acceleration during turns. Set to zero to disable centripetal acceleration
          compensation during fixed wing flight modes.
      type: float
      default: 15.0
      min: 0.0
      unit: m/s
      max: 100.0
      decimal: 1
