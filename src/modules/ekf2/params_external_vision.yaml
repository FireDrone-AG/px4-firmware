module_name: ekf2
parameters:
- group: EKF2
  definitions:
    EKF2_EV_CTRL:
      description:
        short: External vision (EV) sensor aiding
        long: 'Set bits in the following positions to enable: 0 : Horizontal position
          fusion 1 : Vertical position fusion 2 : 3D velocity fusion 3 : Yaw'
      type: bitmask
      bit:
        0: Horizontal position
        1: Vertical position
        2: 3D velocity
        3: Yaw
      default: 0
      min: 0
      max: 15
    EKF2_EV_DELAY:
      description:
        short: Vision Position Estimator delay relative to IMU measurements
      type: float
      default: 0
      min: 0
      max: 300
      unit: ms
      reboot_required: true
      decimal: 1
    EKF2_EV_NOISE_MD:
      description:
        short: External vision (EV) noise mode
        long: If set to 0 (default) the measurement noise is taken from the vision
          message and the EV noise parameters are used as a lower bound. If set to
          1 the observation noise is set from the parameters directly,
      type: enum
      values:
        0: EV reported variance (parameter lower bound)
        1: EV noise parameters
      default: 0
    EKF2_EV_QMIN:
      description:
        short: External vision (EV) minimum quality (optional)
        long: External vision will only be started and fused if the quality metric
          is above this threshold. The quality metric is a completely optional field
          provided by some VIO systems.
      type: int32
      default: 0
      min: 0
      max: 100
      decimal: 1
    EKF2_EVA_NOISE:
      description:
        short: Measurement noise for vision angle measurements
        long:  Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 0.1
      min: 0.05
      unit: rad
      decimal: 2
    EKF2_EVP_GATE:
      description:
        short: Gate size for vision position fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 5.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_EVP_NOISE:
      description:
        short: Measurement noise for vision position measurements
        long:  Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 0.1
      min: 0.01
      unit: m
      decimal: 2
    EKF2_EVP_B_NOISE:
      description:
        short: Process noise for the vision horizontal position bias
        long: 'Random walk of the bias between vision position and the other horizontal position
          source (GNSS), estimated while both are fused. Lower values make the vision position
          follow its own drift for longer before the other source corrects it. Should match the
          horizontal drift rate of the vision system.'
      type: float
      default: 0.13
      min: 0.0
      max: 1.0
      unit: m/s/sqrt(Hz)
      decimal: 3
    EKF2_EVH_B_NOISE:
      description:
        short: Process noise for the vision height bias
        long: 'Random walk of the bias between vision height and the height reference (e.g. GNSS),
          estimated while vision height is fused and is not the reference. Sets how fast reference
          height wander is passed into the altitude estimate: the crossover time constant scales
          with 1/EKF2_EVH_B_NOISE. Should match the vertical drift rate of the vision system.'
      type: float
      default: 0.13
      min: 0.0
      max: 1.0
      unit: m/s/sqrt(Hz)
      decimal: 3
    EKF2_EV_B_BOOST:
      description:
        short: Vision bias offset boost
        long: 'Set bits to enable the x1000 process noise boost of the vision bias estimators while
          their innovations keep the same sign for longer than about 10 s. Reference sources whose
          error is correlated over minutes (GNSS height) trigger it almost permanently, which
          undoes a low EKF2_EVH_B_NOISE or EKF2_EVP_B_NOISE.'
      type: bitmask
      bit:
        0: Horizontal position bias
        1: Height bias
      default: 3
      min: 0
      max: 3
    EKF2_EVV_GATE:
      description:
        short: Gate size for vision velocity estimate fusion
        long: Sets the number of standard deviations used by the innovation consistency
          test.
      type: float
      default: 3.0
      min: 1.0
      unit: SD
      decimal: 1
    EKF2_EVV_NOISE:
      description:
        short: Measurement noise for vision velocity measurements
        long:  Used to lower bound or replace the uncertainty included in the message
      type: float
      default: 0.1
      min: 0.01
      unit: m/s
      decimal: 2
    EKF2_EV_POS_X:
      description:
        short: X position of VI sensor focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_EV_POS_Y:
      description:
        short: Y position of VI sensor focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
    EKF2_EV_POS_Z:
      description:
        short: Z position of VI sensor focal point in body frame
        long: Forward axis with origin relative to vehicle centre of gravity
      type: float
      default: 0.0
      unit: m
      decimal: 3
